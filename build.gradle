// Top-level build file
buildscript {
    ext.kotlin_version = "2.0.21"  // ← آپدیت شد
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.0'  // ← خیلی خوبه!
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }  // ← برای MPAndroidChart
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
